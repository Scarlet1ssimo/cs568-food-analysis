[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs568-food-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.5",
    "google-genai>=1.73.1",
    "kaggle>=2.1.0",
    "langchain-core>=0.3.79",
    "langchain-google-genai>=2.1.10",
    "langchain-openai>=0.3.35",
    "matplotlib>=3.10.0",
    "numpy>=2.4.4",
    "openai>=2.32.0",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "tenacity>=9.1.4",
    "tqdm>=4.67.3",
]

[project.scripts]
cs568-prepare = "cs568_food_analysis.cli:main_prepare"
cs568-analyze = "cs568_food_analysis.cli:main_analyze"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
